<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>CCAR-F Study Hub</title>
    <script>
      // Set the theme class before first paint so dark mode never flashes white.
      // Must match src/lib/theme.ts (same key, same resolution rules).
      try {
        var t = localStorage.getItem("ccarf-theme");
        var dark =
          t === "dark" ||
          ((t === "system" || t === null) &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {
        /* storage or matchMedia blocked — light is the safe default */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
